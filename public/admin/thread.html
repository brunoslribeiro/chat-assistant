<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Thread</title>
    <style>
      body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0f172a;color:#e2e8f0;margin:0}
      header{padding:12px;border-bottom:1px solid #1e293b;display:flex;gap:8px;align-items:center}
      main{padding:12px;display:grid;grid-template-columns:2fr 1fr;gap:12px}
      .box{border:1px solid #1e293b;border-radius:8px;padding:10px;background:#0b1220}
      .msg{margin:6px 0;padding:8px;border-radius:8px}
      .user{background:#14243b}
      .assistant{background:#132235}
      pre{white-space:pre-wrap}
    </style>
  </head>
  <body>
    <header>
      <button onclick="location.href='/admin/'">Voltar</button>
      <button onclick="location.href='/chat'" style="margin-left:8px">Ir para Chat</button>
      <span id="title" style="margin-left:8px;color:#94a3b8"></span>
      <button style="margin-left:auto" onclick="exportDecisions()">Exportar decisões</button>
    </header>
    <main>
      <div class="box">
        <h3>Mensagens</h3>
        <div id="msgs"></div>
      </div>
      <div class="box">
        <h3>Decisões</h3>
        <div id="decs"></div>
      </div>
    </main>
    <script>
      const qs = new URLSearchParams(location.search);
      const threadId = qs.get('threadId');
      document.getElementById('title').textContent = threadId;
      async function load(){
        const r = await fetch(`/admin/threads/${encodeURIComponent(threadId)}/messages`);
        if (!r.ok) { alert('Falha'); return; }
        const data = await r.json();
        const msgs = document.getElementById('msgs'); msgs.innerHTML='';
        for (const m of data.messages){
          const div = document.createElement('div');
          div.className = `msg ${m.role}`;
          div.innerHTML = `<div style='font-size:12px;color:#94a3b8'>${new Date(m.createdAt).toLocaleString()} • ${m.role}</div><pre>${(m.content||'')}</pre>`;
          msgs.appendChild(div);
        }
        const decs = document.getElementById('decs'); decs.innerHTML='';
        for (const d of data.decisions){
          const div = document.createElement('div');
          div.className = 'msg';
          div.innerHTML = `<div style='font-size:12px;color:#94a3b8'>${new Date(d.createdAt).toLocaleString()}</div>`+
            `<pre>${JSON.stringify(d.decision, null, 2)}</pre>`;
          decs.appendChild(div);
        }
      }
      function exportDecisions(){
        location.href = `/admin/export/decisions?threadId=${encodeURIComponent(threadId)}`;
      }
      load();
    </script>
  </body>
  </html>
