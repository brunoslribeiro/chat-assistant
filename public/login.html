<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:#0f172a; color:#e2e8f0; display:flex; align-items:center; justify-content:center; min-height:100vh; }
      .card { width: 360px; background:#0b1220; padding:20px; border:1px solid #1e293b; border-radius:10px; }
      h1 { font-size:18px; margin:0 0 12px; }
      label { display:block; font-size:12px; color:#94a3b8; margin-top:10px; }
      input { width:100%; padding:10px; border-radius:8px; border:1px solid #1e293b; background:#0a0f1a; color:#e2e8f0; }
      button { width:100%; padding:10px; margin-top:14px; border-radius:8px; border:1px solid #1e293b; background:#16a34a; color:#06120a; cursor:pointer; font-weight:600; }
      .err { background:#3b1d1d; color:#fecaca; padding:8px; border-radius:8px; margin-top:10px; display:none; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Acessar</h1>
      <div id="err" class="err"></div>
      <label>Email</label>
      <input id="email" type="email" />
      <label>Senha</label>
      <input id="password" type="password" />
      <button id="submit">Entrar</button>
      <p style="font-size:12px;color:#94a3b8;margin-top:10px;">Primeiro acesso? Se não houver usuários, o primeiro login cria um admin via /auth/register.</p>
    </div>
    <script>
      const $ = (id) => document.getElementById(id);
      async function tryRegister(email, password) {
        const r = await fetch('/auth/register', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ email, password }) });
        return r.ok;
      }
      function getNext() {
        try {
          const url = new URL(location.href);
          const n = url.searchParams.get('next');
          return n && n.startsWith('/') ? n : '/admin/';
        } catch { return '/admin/'; }
      }

      $('submit').onclick = async () => {
        const email = $('email').value.trim();
        const password = $('password').value.trim();
        const err = $('err'); err.style.display='none';
        if (!email || !password) { err.textContent = 'Informe email e senha'; err.style.display='block'; return; }
        let r = await fetch('/auth/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ email, password }) });
        if (!r.ok && r.status === 401) {
          // tentar registro se não houver usuários
          const ok = await tryRegister(email, password);
          if (ok) { window.location.assign(getNext()); return; }
        }
        if (!r.ok) {
          const txt = await r.text(); err.textContent = 'Falha no login: ' + txt; err.style.display='block'; return;
        }
        window.location.assign(getNext());
      };
    </script>
  </body>
  </html>
